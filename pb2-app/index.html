<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PB2">
<meta name="theme-color" content="#14161a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>PB2 Powerbuilding</title>
<style>
:root{--bg:#14161a;--card:#1e2127;--card2:#262a32;--tx:#f2f2f2;--mut:#9aa0ab;--acc:#ff6d01;--ok:#34a853;--line:#2d323b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 16px calc(150px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:var(--card2);border-radius:12px;padding:10px 14px;cursor:pointer}
button:active{opacity:.7}
.top{display:flex;align-items:center;gap:8px;padding:14px 0;position:sticky;top:0;background:var(--bg);z-index:5}
.top h1{font-size:19px;margin:0;flex:1}
.sub{color:var(--mut);font-size:13px}
.weeknav{display:flex;align-items:center;gap:10px;margin:6px 0 16px}
.weeknav .w{flex:1;text-align:center}
.weeknav .w b{font-size:22px;display:block}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.sess{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);padding:16px}
.sess .t{flex:1}.sess b{font-size:17px;display:block}
.pct{font-weight:700;color:var(--acc)}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.chip{display:inline-block;font-size:12px;color:var(--mut);background:var(--card2);padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:middle}
.ex h3{margin:0 0 4px;font-size:17px}
.meta{color:var(--mut);font-size:13px;margin:4px 0 10px}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px}.meta span{white-space:nowrap}
.note{font-size:13px;color:var(--mut);margin:0 0 10px}
.sets{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.set{width:46px;height:46px;border-radius:50%;font-weight:700;font-size:17px;background:var(--card2);border:2px solid var(--line)}
.set.done{background:var(--ok);border-color:var(--ok);color:#fff}
.wt{margin-left:auto;display:flex;align-items:center;gap:6px}
.wt input{width:72px;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font-size:16px;text-align:center}
.orange{background:var(--acc);color:#fff;font-weight:600}
.rest{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:9;display:none}
.rest.on{display:block}
.rest .row{display:flex;align-items:center;gap:10px}
.rest .row>div{flex:1;min-width:0}.rest .row button{padding:10px 11px;font-size:15px;white-space:nowrap}.rest .big{font-size:34px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.rest .lab{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest.end .big{color:var(--acc)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet>div{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
input.txt{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:12px;font-size:16px}
.timer{font-variant-numeric:tabular-nums;color:var(--mut);font-size:15px}
.hide{display:none!important}
.hint{font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<div id="app"></div>
<div class="rest" id="rest"><div class="row"><div><div class="lab" id="restLab">Repos</div><div class="big" id="restBig">0:00</div></div><button id="rMinus">−15s</button><button id="rPlus">+30s</button><button class="orange" id="rSkip">Passer</button></div></div>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>

const key=(w,si,ei)=>`${w}|${si}|${ei}`;
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

/* audio */
let ac;
function unlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function beep(f=880,d=.18,v=.25){try{unlock();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function alarm(){beep(988,.15);setTimeout(()=>beep(988,.15),220);setTimeout(()=>beep(1318,.35),440);try{navigator.vibrate&&navigator.vibrate([200,100,200,100,400])}catch(e){}}
document.addEventListener('touchstart',unlock,{once:true});document.addEventListener('click',unlock);

/* wake lock */
let wl=null;
async function keepAwake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(view.name==='session')keepAwake();tick()}});

/* rest timer (end timestamp => exact even if page was in background) */
let restEnd=0,restLab='',restWarned=0,restFired=true;
function startRest(sec,lab){if(sec<=0)return;restEnd=Date.now()+sec*1000;restLab=lab;restFired=false;restWarned=0;$('#rest').classList.add('on');$('#rest').classList.remove('end');tick()}
function tick(){
  const el=$('#rest');if(!el.classList.contains('on'))return;
  const left=(restEnd-Date.now())/1000;
  $('#restLab').textContent=restLab;
  if(left>0){$('#restBig').textContent=fmt(Math.ceil(left));
    const c=Math.ceil(left);if(c<=3&&restWarned!==c){restWarned=c;beep(660,.08,.2)}}
  else{$('#restBig').textContent='GO !';el.classList.add('end');
    if(!restFired){restFired=true;alarm();setTimeout(()=>{if(restEnd&&Date.now()>=restEnd+4000)hideRest()},4500)}}
  const st=$('#sessTimer');if(st&&view.name==='session'){const t=S.sessStart[view.w+'|'+view.si];st.textContent=t?fmt((Date.now()-t)/1000):'0:00'}
}
function hideRest(){$('#rest').classList.remove('on');restEnd=0}
$('#rSkip').onclick=hideRest;
$('#rPlus').onclick=()=>{restEnd+=30000;restFired=false;restWarned=0;$('#rest').classList.remove('end');tick()};
$('#rMinus').onclick=()=>{restEnd-=15000;tick()};
setInterval(tick,250);

/* sheet */
function openSheet(h){$('#sheetBody').innerHTML=h;$('#sheet').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on')}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});

/* helpers */
function progress(w,si){const ss=sessions(w)[si];let t=0,d=0;ss.ex.forEach((e,ei)=>{for(let k=0;k<e.s;k++){t++;if(S.done[key(w,si,ei)+'|'+k])d++}});return t?Math.round(d/t*100):0}
function musicOpen(){
  if(!S.music){openMusic();return}
  location.href=S.music;
}
function openMusic(){openSheet(`<h2 style="margin-top:0">Ma playlist YouTube Music</h2>
<p class="hint">Colle le lien de ta playlist (dans l'app YouTube Music : Partager → Copier le lien).</p>
<input class="txt" id="mu" placeholder="https://music.youtube.com/playlist?list=..." value="${esc(S.music)}">
<div style="display:flex;gap:8px;margin-top:12px"><button class="orange" style="flex:1" onclick="S.music=$('#mu').value.trim();save();closeSheet()">Enregistrer</button><button onclick="closeSheet()">Fermer</button></div>
<p class="hint">Astuce : lance la musique d'abord, puis reviens ici. Elle continue en arrière-plan.</p>`)}
function openTimer(){openSheet(`<h2 style="margin-top:0">Minuteur</h2><div class="grid">${[30,45,60,90,120,150,180,240].map(s=>`<button onclick="closeSheet();startRest(${s},'Minuteur')">${fmt(s)}</button>`).join('')}</div><button onclick="closeSheet()" style="width:100%">Fermer</button>`)}
function reset(){openSheet(`<h2 style="margin-top:0">Semaine ${S.week}</h2><p>Remettre à zéro les séries cochées de cette semaine ?</p><div style="display:flex;gap:8px"><button class="orange" style="flex:1" onclick="resetWeek()">Oui, remettre à zéro</button><button onclick="closeSheet()">Annuler</button></div>`)}
function resetWeek(){const p=S.week+'|';Object.keys(S.done).forEach(k=>{if(k.startsWith(p))delete S.done[k]});Object.keys(S.sessStart).forEach(k=>{if(k.startsWith(p))delete S.sessStart[k]});save();closeSheet();render()}

/* views */
function render(){view.name==='home'?home():session()}
function home(){
  const w=S.week,ss=sessions(w);
  $('#app').innerHTML=`<div class="top"><h1>PB2 Powerbuilding</h1><button onclick="openMusic()">🎵</button><button onclick="openTimer()">⏱</button></div>
  <div class="weeknav"><button onclick="setWeek(${w-1})" ${w<=1?'disabled':''}>‹</button>
  <div class="w"><b>Semaine ${w}</b><span class="sub">${type(w)==='fb'?'Full Body':'Push / Pull / Legs'}${w===8?' · semi-deload : évite l\'échec, charges plus légères':''}</span></div>
  <button onclick="setWeek(${w+1})" ${w>=WEEKS?'disabled':''}>›</button></div>
  ${ss.map((s,i)=>{const p=progress(w,i);return `<button class="sess" onclick="openSession(${i})"><div class="t"><b>${esc(s.name)}</b><span class="sub">${s.ex.length} exercices</span><div class="bar"><i style="width:${p}%"></i></div></div><span class="pct">${p}%</span></button>`}).join('')}
  <p style="text-align:center"><button onclick="reset()" class="sub">Remettre la semaine à zéro</button></p>`;
}
function setWeek(w){S.week=Math.min(WEEKS,Math.max(1,w));save();home()}
function openSession(si){view={name:'session',w:S.week,si};keepAwake();window.scrollTo(0,0);session()}
function session(){
  const {w,si}=view,s=sessions(w)[si];
  const started=S.sessStart[w+'|'+si];
  $('#app').innerHTML=`<div class="top"><button onclick="back()">‹</button><h1>${esc(s.name)}<div class="timer">Sem. ${w} · <span id="sessTimer">${started?fmt((Date.now()-started)/1000):'0:00'}</span></div></h1><button onclick="musicOpen()">🎵</button><button onclick="openTimer()">⏱</button></div>
  ${s.ex.map((e,ei)=>{
    const last=S.wt[`${w-2>0&&type(w-2)===type(w)?w-2:0}|${si}|${ei}`]||'';
    const cur=S.wt[key(w,si,ei)]||'';
    return `<div class="card ex"><h3>${esc(e.n)}<span class="chip">${esc(e.m)}</span></h3>
    <div class="meta"><span>Éch. ${e.w}</span><span>Reps ${esc(e.r)}</span><span>RPE ${esc(e.rpe)}</span><span>Repos ${esc(e.rest)}</span>${e.each?'<span>par côté</span>':''}</div>
    ${e.note?`<p class="note">${esc(e.note)}</p>`:''}
    <div class="sets">${Array.from({length:e.s},(_,k)=>`<button class="set ${S.done[key(w,si,ei)+'|'+k]?'done':''}" onclick="toggle(${ei},${k})">${k+1}</button>`).join('')}
    <div class="wt"><input type="number" inputmode="decimal" placeholder="${esc(last||'kg')}" value="${esc(cur)}" onchange="setWt(${ei},this.value)"><span class="hint">kg</span></div></div></div>`}).join('')}`;
}
function back(){view={name:'home'};hideRest();home()}
function toggle(ei,k){
  const {w,si}=view,e=sessions(w)[si].ex[ei],kk=key(w,si,ei)+'|'+k;
  if(S.done[kk]){delete S.done[kk]}
  else{S.done[kk]=1;if(!S.sessStart[w+'|'+si])S.sessStart[w+'|'+si]=Date.now();
    const last=Array.from({length:e.s}).every((_,j)=>S.done[key(w,si,ei)+'|'+j]);
    startRest(e.restSec,last?'Repos · exo suivant':`Repos · série ${k+2}/${e.s}`)}
  save();session()
}
function setWt(ei,v){S.wt[key(view.w,view.si,ei)]=v;save()}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
